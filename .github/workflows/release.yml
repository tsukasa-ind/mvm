name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: タグとバージョンの一致を確認
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$version\"" package.json || { echo "package.json のバージョンがタグ $GITHUB_REF_NAME と一致しない"; exit 1; }
          grep -q "\"version\": \"$version\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json のバージョンがタグ $GITHUB_REF_NAME と一致しない"; exit 1; }
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml || { echo "Cargo.toml のバージョンがタグ $GITHUB_REF_NAME と一致しない"; exit 1; }
      - name: Linux 依存パッケージ
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mvm ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
